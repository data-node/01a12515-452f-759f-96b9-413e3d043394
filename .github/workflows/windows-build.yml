name: Build Windows downloads

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the project
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run SQLite and provider tests
        run: npm test

      - name: Check types and build the application
        run: npm run build

      - name: Build installer and portable application on Windows
        shell: pwsh
        run: |
          npm exec -- electron-builder --win nsis portable --x64 --config.win.signAndEditExecutable=false 2>&1 | Tee-Object -FilePath windows-packaging.log
          $notchBuildExit = $LASTEXITCODE
          if ($notchBuildExit -ne 0) {
            Get-Content windows-packaging.log -Tail 12 | ForEach-Object { Write-Output "::error::$_" }
            exit $notchBuildExit
          }

      - name: Verify capture and retrieval in the packaged Windows runtime
        run: npm run test:desktop
        env:
          NOTCH_SMOKE_EXECUTABLE: release/win-unpacked/Notch.exe

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $apps = @(Get-ChildItem release -Filter *.exe)
          if ($apps.Count -lt 2) {
            throw 'Expected both an installer and a portable Windows executable.'
          }
          foreach ($app in $apps) {
            $digest = (Get-FileHash $app.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($app.Name)" | Set-Content -Path "$($app.FullName).sha256" -Encoding ascii
          }

      - name: Upload the downloadable application bundle
        uses: actions/upload-artifact@v4
        with:
          name: Notch-Windows-x64
          path: |
            release/*.exe
            release/*.exe.sha256
            docs/previews/*.png
            README.md
          if-no-files-found: error
          retention-days: 14

      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Notch-Windows-diagnostics
          path: |
            windows-packaging.log
            test-results/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Notch-Windows-x64
          path: release-download
      - name: Publish the verified versioned downloads
        env:
          GH_TOKEN: ${{ github.token }}
          NOTCH_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$NOTCH_RELEASE_TAG" release-download/release/*.exe release-download/release/*.exe.sha256 --verify-tag --title "Notch $NOTCH_RELEASE_TAG" --notes-file "docs/releases/${NOTCH_RELEASE_TAG#v}.md"
